name: Watch Next probe APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/watch-next-probe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout original TizenTube Bridge sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add isolated Watch Next test activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path('app/src/main/java/experiment/continuetube/WatchNextProbeActivity.java')
          source.parent.mkdir(parents=True, exist_ok=True)
          source.write_text(r'''package experiment.continuetube;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.media.tv.TvContract;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.widget.Toast;

          public final class WatchNextProbeActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  new Thread(() -> {
                      String result;
                      if (Build.VERSION.SDK_INT < 26) {
                          result = "Watch Next requires Android 8.0+";
                      } else {
                          try {
                              final String videoId = "jNQXAC9IVRw";
                              Intent play = new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://www.youtube.com/watch?v=" + videoId));
                              play.setPackage("com.google.android.youtube.tv");
                              ContentValues cv = new ContentValues();
                              cv.put(TvContract.WatchNextPrograms.COLUMN_TITLE,
                                  "ContinueTube probe: Me at the zoo");
                              cv.put(TvContract.WatchNextPrograms.COLUMN_WATCH_NEXT_TYPE,
                                  TvContract.WatchNextPrograms.WATCH_NEXT_TYPE_CONTINUE);
                              cv.put(TvContract.WatchNextPrograms.COLUMN_LAST_ENGAGEMENT_TIME_UTC_MILLIS,
                                  System.currentTimeMillis());
                              cv.put("type", 4); // clip
                              cv.put("duration_millis", 180000);
                              cv.put("last_playback_position_millis", 65000);
                              cv.put("intent_uri", play.toUri(Intent.URI_INTENT_SCHEME));
                              cv.put("internal_provider_id", "continuetube-probe-20261025");
                              cv.put("poster_art_uri",
                                  "https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg");
                              cv.put("thumbnail_uri",
                                  "https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg");
                              Uri inserted = getContentResolver().insert(
                                  TvContract.WatchNextPrograms.CONTENT_URI, cv);
                              result = inserted == null ? "Insert returned null" : "Inserted: " + inserted;
                              Log.i("ContinueTubeProbe", result);
                          } catch (Exception error) {
                              result = "Failed: " + error.getClass().getSimpleName()
                                  + ": " + error.getMessage();
                              Log.e("ContinueTubeProbe", result, error);
                          }
                      }
                      final String toast = result;
                      runOnUiThread(() -> {
                          Toast.makeText(this, toast, Toast.LENGTH_LONG).show();
                          finish();
                      });
                  }).start();
              }
          }
          ''', encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          contents = manifest.read_text(encoding='utf-8')
          if 'experiment.continuetube.WatchNextProbeActivity' not in contents:
              activity = '''
                  <activity
                      android:name="experiment.continuetube.WatchNextProbeActivity"
                      android:exported="true"
                      android:label="Watch Next Probe">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              '''
              if '</application>' not in contents:
                  raise RuntimeError('Could not find </application> in AndroidManifest.xml')
              contents = contents.replace('</application>', activity + '\n    </application>', 1)
              manifest.write_text(contents, encoding='utf-8')
          ET.parse(manifest)
          print('Probe activity added successfully')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-next-probe-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
